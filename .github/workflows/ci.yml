name: aaguids update

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.4"

      - name: Run Gen & Sync
        run: |
          go -C gen run .
          go -C sync run .

      - name: Run Tests
        run: go test ./...

      - name: Create Pull Request and Merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Check if there are any changes
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          # Create a dynamic branch name for the update
          BRANCH_NAME="aaguids-update-${{ github.run_number }}"
          git checkout -b "$BRANCH_NAME"

          # Commit changes
          git commit -m "chore: auto-update aaguids data"
          git push origin "$BRANCH_NAME"

          # Create the Pull Request and capture its URL
          PR_URL=$(gh pr create \
            --title "chore: auto-update aaguids data" \
            --body "Automated background update of AAGUID records." \
            --base main \
            --head "$BRANCH_NAME")

          # Merge it immediately (no settings required)
          gh pr merge "$PR_URL" --squash --delete-branch

      - name: Upload to Cloudflare R2 & Purge Cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          npx wrangler r2 object put "$R2_BUCKET/aaguids.json" --file="../json/aaguids.json" --remote

          # 2. Purge Cloudflare Edge Cache for the CDN URL
          curl -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"files":["https://cdn.oddinpay.com/aaguids.json"]}'
