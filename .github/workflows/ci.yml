name: Aaguids Update

on:
  push:
    branches: [main]

  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Run Gen & Sync
        run: |
          go -C gen run .
          go -C sync run .

      - name: Test & Check Changes
        run: |
          go test ./...
          git diff --exit-code
